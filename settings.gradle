pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// Fabric Loom 1.14 добавляет свой служебный репозиторий LoomLocalRemappedMods.
// Поэтому нельзя использовать FAIL_ON_PROJECT_REPOS — Gradle упадет на конфигурации.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

rootProject.name = 'ChatWindows-Fabric-1.21.11'
