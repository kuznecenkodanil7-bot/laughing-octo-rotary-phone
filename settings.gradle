pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// ВАЖНО:
// Нельзя ставить RepositoriesMode.FAIL_ON_PROJECT_REPOS для Fabric Loom 1.14,
// потому что Loom сам добавляет служебный репозиторий LoomLocalRemappedMods.
// При FAIL_ON_PROJECT_REPOS Gradle падает ещё на этапе конфигурации.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

rootProject.name = 'ChatWindows-Fabric-1.21.11'
